function inferGovernance(proj) {
  const note = (proj.note || "").toLowerCase();
  const glassNotApproved = (proj.glass || "").toLowerCase().includes("not approved");
  const cuttingNotReady = note.includes("cutting list not ready");
  const shortage = note.includes("shortage");
  const stopInstall = note.includes("installation: stop");
  const rectification = note.includes("rectification");

  let blockerOwner = proj.blockerOwner || "";
  if (!blockerOwner) {
    if (glassNotApproved) blockerOwner = "client";
    else if (shortage) blockerOwner = "procurement";
    else if (cuttingNotReady) blockerOwner = "design";
    else if (stopInstall || rectification) blockerOwner = "site";
    else if (proj.phase === "making" || proj.phase === "stopped") blockerOwner = "factory";
  }

  let nextAction = proj.nextAction || "";
  if (!nextAction) {
    if (glassNotApproved) nextAction = "حسم واعتماد مواصفات الزجاج مع العميل/الاستشاري قبل استكمال التوريد";
    else if (shortage) nextAction = "تسريع توريد الخامات الناقصة لمعالجة البنود المعلقة";
    else if (cuttingNotReady) nextAction = "إنجاز قائمة القطع (Cutting List) لفتح التصنيع";
    else if (stopInstall) nextAction = "معالجة أسباب إيقاف التركيب وإعادة جدولة الموقع";
    else if (rectification) nextAction = "إغلاق بنود التعديل والـ Rectification وتسليم الموقع";
    else if (proj.phase === "done") nextAction = "مراجعة الإغلاق النهائي وتسليم المستندات";
    else nextAction = "متابعة وتيرة التصنيع والتركيب حسب الخطة";
  }

  return {
    ...proj,
    blockerOwner,
    nextAction,
    glassApproved: proj.glassApproved !== undefined ? proj.glassApproved : !glassNotApproved,
    cuttingListReady: proj.cuttingListReady !== undefined ? proj.cuttingListReady : !cuttingNotReady
  };
}

function normalizeProjectUnits(proj) {
  const units = proj.units || {};
  const total = Number(proj.total) || 0;
  const balance = Number(proj.balance) || 0;
  const totalCompleted = Math.max(0, total - balance);
  const sumUnits = UNIT_KEYS.reduce((s, k) => s + (Number(units[k]) || 0), 0);
  const ratio = sumUnits > 0 ? totalCompleted / sumUnits : 0;

  const doneUnits = {};
  let assignedDone = 0;
  UNIT_KEYS.forEach((k, idx) => {
    const req = Number(units[k]) || 0;
    if (idx < UNIT_KEYS.length - 1) {
      const d = Math.min(req, Math.round(req * ratio));
      doneUnits[k] = d;
      assignedDone += d;
    } else {
      doneUnits[k] = Math.min(req, Math.max(0, totalCompleted - assignedDone));
    }
  });
  return inferGovernance({ ...proj, total, balance, units, doneUnits });
}

const DAY_MS = 86400000;
const toDay = (str) => {
  if (!str) return null;
  const [y, m, d] = str.split("-").map(Number);
  return Math.round(Date.UTC(y, m - 1, d) / DAY_MS);
};
const todayDay = () => {
  const n = new Date();
  return Math.round(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()) / DAY_MS);
};
const calcProgress = (p) => (p.total > 0 ? Math.round(((p.total - p.balance) / p.total) * 100) : 0);
const hasObstacle = (p) => {
  if (p.phase === "stopped") return true;
  const note = (p.note || "").toLowerCase();
  return ["stop", "shortage", "not approved", "not ready", "hold", "damage"].some((k) => note.includes(k));
};
const isBottleneck = (p) => p.phase !== "done" && (!p.glassApproved || !p.cuttingListReady);
const isNearClosure = (p) => p.phase !== "done" && (calcProgress(p) >= 85 || (p.balance > 0 && p.balance <= 4));
const isProjectLate = (p, today) => Boolean(p.delivery && toDay(p.delivery) < today && calcProgress(p) < 50 && p.phase !== "done");
const formatHours = (ms) => {
  const hrs = ms / 3600000;
  return hrs < 0.1 ? "0.0 س" : `${hrs.toFixed(1)} س`;
};

function ExecutiveCharts({ projects, tasks, designers }) {
  const phaseCanvasRef = useRef(null);
  const progressCanvasRef = useRef(null);
  const teamCanvasRef = useRef(null);
  const chartsRef = useRef({});

  useEffect(() => {
    Object.values(chartsRef.current).forEach((ch) => ch && ch.destroy());

    if (phaseCanvasRef.current) {
      const counts = Object.keys(PHASE_LABELS).map((k) => projects.filter((p) => p.phase === k).length);
      chartsRef.current.phase = new Chart(phaseCanvasRef.current, {
        type: "doughnut",
        data: {
          labels: Object.values(PHASE_LABELS),
          datasets: [{
            data: counts,
            backgroundColor: ["#1baf7a", "#2a78d6", "#eb6834", "#66717b", "#d03b3b"],
            borderWidth: 1
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { position: "bottom" } }
        }
      });
    }

    if (progressCanvasRef.current) {
      const topProj = projects.slice(0, 10);
      chartsRef.current.progress = new Chart(progressCanvasRef.current, {
        type: "bar",
        data: {
          labels: topProj.map((p) => p.file || p.customer.slice(0, 12)),
          datasets: [{
            label: "نسبة الإنجاز %",
            data: topProj.map((p) => calcProgress(p)),
            backgroundColor: topProj.map((p) => (p.phase === "done" ? "#1baf7a" : p.phase === "stopped" ? "#d03b3b" : "#2a78d6")),
            borderRadius: 6
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: { y: { min: 0, max: 100 } },
          plugins: { legend: { display: false } }
        }
      });
    }

    if (teamCanvasRef.current) {
      chartsRef.current.team = new Chart(teamCanvasRef.current, {
        type: "bar",
        data: {
          labels: designers.map((d) => d.name),
          datasets: [
            {
              label: "مكتملة (Done)",
              data: designers.map((d) => tasks.filter((t) => t.designerId === d.id && t.status === "done").length),
              backgroundColor: "#1baf7a"
            },
            {
              label: "قيد التنفيذ (Ongoing)",
              data: designers.map((d) => tasks.filter((t) => t.designerId === d.id && t.status === "ongoing").length),
              backgroundColor: "#eb6834"
            },
            {
              label: "للتنفيذ / مشاكل",
              data: designers.map((d) => tasks.filter((t) => t.designerId === d.id && (t.status === "todo" || t.status === "issues")).length),
              backgroundColor: "#2a78d6"
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true } },
          plugins: { legend: { position: "bottom" } }
        }
      });
    }

    return () => Object.values(chartsRef.current).forEach((ch) => ch && ch.destroy());
  }, [projects, tasks, designers]);

  return (
    <div className="charts-grid">
      <div className="card">
        <div className="card-head"><h2>توزيع المشاريع حسب المرحلة</h2></div>
        <div className="chart-box"><canvas ref={phaseCanvasRef} /></div>
      </div>
      <div className="card">
        <div className="card-head"><h2>نسب إنجاز المشاريع (%)</h2></div>
        <div className="chart-box"><canvas ref={progressCanvasRef} /></div>
      </div>
      <div className="card">
        <div className="card-head"><h2>حالة مهام فريق التصميم</h2></div>
        <div className="chart-box"><canvas ref={teamCanvasRef} /></div>
      </div>
    </div>
  );
}
