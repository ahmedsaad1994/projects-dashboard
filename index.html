<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة المشاريع وإدارة فريق التصميم</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --bg: #eef1f2;
      --surface: #fcfcfb;
      --surface-2: #f2f4f4;
      --ink: #121a21;
      --ink-2: #47525c;
      --ink-3: #66717b;
      --line: #dde2e4;
      --line-strong: #c3c9cc;
      --hover: rgba(18, 26, 33, .05);
      --s-todo: #2a78d6;
      --s-ongoing: #eb6834;
      --s-issues: #d03b3b;
      --s-done: #1baf7a;
      --good: #0ca30c;
      --warn: #fab219;
      --crit: #d03b3b;
      --crit-text: #b82e2e;
      --bar: #a9b7c1;
      --shadow: 0 8px 24px rgba(18, 26, 33, .12);
      --font: "IBM Plex Sans Arabic", system-ui, -apple-system, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1112;
        --surface: #1a1a19;
        --surface-2: #222423;
        --ink: #f0efec;
        --ink-2: #c3c2b7;
        --ink-3: #9b9a93;
        --line: #2c2c2a;
        --line-strong: #3d3d3a;
        --hover: rgba(255, 255, 255, .06);
        --crit-text: #ee7777;
        --bar: #4b5963;
        --shadow: 0 8px 24px rgba(0, 0, 0, .45);
      }
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.55;
    }
    button, select, input, textarea { font: inherit; color: inherit; }
    .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }
    .app { max-width: 1380px; margin-inline: auto; padding: 24px 16px 64px; display: flex; flex-direction: column; gap: 16px; }

    .topbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; }
    .eyebrow { margin: 0 0 4px; font-size: 12px; color: var(--ink-3); }
    h1 { margin: 0; font-size: 28px; font-weight: 700; line-height: 1.2; }
    .nav-tabs { display: flex; gap: 8px; background: var(--surface); padding: 6px; border-radius: 10px; border: 1px solid var(--line); }
    .tab-btn {
      padding: 8px 18px; border: 0; border-radius: 7px; background: transparent;
      font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
      color: var(--ink-2); transition: all .15s;
    }
    .tab-btn:hover { background: var(--hover); color: var(--ink); }
    .tab-btn.active { background: var(--ink); color: var(--surface); }

    .actions-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .btn {
      height: 36px; padding: 0 14px; border: 1px solid var(--line-strong); border-radius: 7px;
      background: var(--surface); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-weight: 500;
    }
    .btn:hover { background: var(--hover); }
    .btn-primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
    .btn-primary:hover { opacity: .92; background: var(--ink); }
    .btn-sm { height: 28px; padding: 0 10px; font-size: 12px; }

    /* Executive KPI Tiles */
    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
    .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 15px 16px; display: flex; flex-direction: column; gap: 4px; }
    .tile .k { font-size: 12.5px; color: var(--ink-2); font-weight: 600; }
    .tile .v { font-size: 30px; font-weight: 700; line-height: 1.15; }
    .tile .s { font-size: 12px; color: var(--ink-3); }
    .tile.is-crit .v, .tile.is-crit .k { color: var(--crit-text); }
    .tile.is-warn .v, .tile.is-warn .k { color: #b4690e; }

    /* Charts Grid */
    .charts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 14px; }
    .chart-box { position: relative; height: 265px; width: 100%; }

    /* Cards & Tables */
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
    .card-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 14px; }
    .card-head h2 { margin: 0; font-size: 17px; font-weight: 600; }
    .count { padding: 1px 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); font-size: 12px; }
    .hint { margin-inline-start: auto; font-size: 12px; color: var(--ink-3); }
