function normalizeProjectUnits(proj) {
  const units = proj.units || {};
  const total = Number(proj.total) || 0;
  const balance = Number(proj.balance) || 0;
  const totalCompleted = Math.max(0, total - balance);
  const sumUnits = UNIT_KEYS.reduce((s, k) => s + (Number(units[k]) || 0), 0);
  const ratio = sumUnits > 0 ? totalCompleted / sumUnits : 0;

  const doneUnits = {};
  let assignedDone = 0;
  UNIT_KEYS.forEach((k, idx) => {
    const req = Number(units[k]) || 0;
    if (idx < UNIT_KEYS.length - 1) {
      const d = Math.min(req, Math.round(req * ratio));
      doneUnits[k] = d;
      assignedDone += d;
    } else {
      doneUnits[k] = Math.min(req, Math.max(0, totalCompleted - assignedDone));
    }
  });
  return { ...proj, total, balance, units, doneUnits };
}

];

const DAY_MS = 86400000;
const toDay = (str) => {
  if (!str) return null;
  const [y, m, d] = str.split("-").map(Number);
  return Math.round(Date.UTC(y, m - 1, d) / DAY_MS);
};
const todayDay = () => {
  const n = new Date();
  return Math.round(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()) / DAY_MS);
};
const calcProgress = (p) => (p.total > 0 ? Math.round(((p.total - p.balance) / p.total) * 100) : 0);
const hasObstacle = (p) => {
  if (p.phase === "stopped") return true;
  const note = (p.note || "").toLowerCase();
  return ["stop", "shortage", "not approved", "not ready", "hold", "damage"].some((k) => note.includes(k));
};
const isProjectLate = (p, today) => Boolean(p.delivery && toDay(p.delivery) < today && calcProgress(p) < 50 && p.phase !== "done");
const formatHours = (ms) => {
  const hrs = ms / 3600000;
  return hrs < 0.1 ? "0.0 س" : `${hrs.toFixed(1)} س`;
};

function ExecutiveCharts({ projects, tasks, designers }) {
  const phaseCanvasRef = useRef(null);
  const progressCanvasRef = useRef(null);
  const teamCanvasRef = useRef(null);
  const chartsRef = useRef({});

  useEffect(() => {
    Object.values(chartsRef.current).forEach((ch) => ch && ch.destroy());

    if (phaseCanvasRef.current) {
      const counts = Object.keys(PHASE_LABELS).map((k) => projects.filter((p) => p.phase === k).length);
      chartsRef.current.phase = new Chart(phaseCanvasRef.current, {
        type: "doughnut",
        data: {
          labels: Object.values(PHASE_LABELS),
          datasets: [{
            data: counts,
            backgroundColor: ["#1baf7a", "#2a78d6", "#eb6834", "#66717b", "#d03b3b"],
            borderWidth: 1
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { position: "bottom" } }
        }
      });
    }

    if (progressCanvasRef.current) {
      const topProj = projects.slice(0, 10);
      chartsRef.current.progress = new Chart(progressCanvasRef.current, {
        type: "bar",
        data: {
          labels: topProj.map((p) => p.file || p.customer.slice(0, 12)),
          datasets: [{
            label: "نسبة الإنجاز %",
            data: topProj.map((p) => calcProgress(p)),
            backgroundColor: topProj.map((p) => (p.phase === "done" ? "#1baf7a" : p.phase === "stopped" ? "#d03b3b" : "#2a78d6")),
            borderRadius: 6
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: { y: { min: 0, max: 100 } },
          plugins: { legend: { display: false } }
        }
      });
    }

    if (teamCanvasRef.current) {
      chartsRef.current.team = new Chart(teamCanvasRef.current, {
        type: "bar",
        data: {
          labels: designers.map((d) => d.name),
          datasets: [
            {
              label: "مكتملة (Done)",
              data: designers.map((d) => tasks.filter((t) => t.designerId === d.id && t.status === "done").length),
              backgroundColor: "#1baf7a"
            },
            {
              label: "قيد التنفيذ (Ongoing)",
              data: designers.map((d) => tasks.filter((t) => t.designerId === d.id && t.status === "ongoing").length),
              backgroundColor: "#eb6834"
            },
            {
              label: "للتنفيذ / مشاكل",
              data: designers.map((d) => tasks.filter((t) => t.designerId === d.id && (t.status === "todo" || t.status === "issues")).length),
              backgroundColor: "#2a78d6"
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true } },
          plugins: { legend: { position: "bottom" } }
        }
      });
    }

    return () => Object.values(chartsRef.current).forEach((ch) => ch && ch.destroy());
  }, [projects, tasks, designers]);

  return (
    <div className="charts-grid">
      <div className="card">
        <div className="card-head"><h2>توزيع المشاريع حسب المرحلة</h2></div>
        <div className="chart-box"><canvas ref={phaseCanvasRef} /></div>
      </div>
      <div className="card">
        <div className="card-head"><h2>نسب إنجاز المشاريع (%)</h2></div>
        <div className="chart-box"><canvas ref={progressCanvasRef} /></div>
      </div>
      <div className="card">
        <div className="card-head"><h2>حالة مهام فريق التصميم</h2></div>
        <div className="chart-box"><canvas ref={teamCanvasRef} /></div>
      </div>
    </div>
  );
}

function ProjectControlModal({ project, onClose, onUpdate }) {
  const [draft, setDraft] = useState(() => ({
    ...project,
    units: { ...project.units },
    doneUnits: { ...(project.doneUnits || {}) }
  }));

  const updateDoneUnit = (key, newDoneVal) => {
    const req = Number(draft.units[key]) || 0;
    const clampedDone = Math.max(0, Math.min(req, Number(newDoneVal) || 0));
    const nextDoneUnits = { ...draft.doneUnits, [key]: clampedDone };
    const totalReq = UNIT_KEYS.reduce((s, k) => s + (Number(draft.units[k]) || 0), 0);
    const totalDone = UNIT_KEYS.reduce((s, k) => s + (Number(nextDoneUnits[k]) || 0), 0);
    const finalTotal = totalReq > 0 ? totalReq : Number(draft.total) || 0;
    const nextBalance = Math.max(0, finalTotal - totalDone);

    const updated = {
      ...draft,
      total: finalTotal,
      balance: nextBalance,
      doneUnits: nextDoneUnits,
      phase: nextBalance === 0 && finalTotal > 0 ? "done" : draft.phase === "done" ? "site" : draft.phase
    };
    setDraft(updated);
    onUpdate(updated);
  };

  const updateReqUnit = (key, newReqVal) => {
    const req = Math.max(0, Number(newReqVal) || 0);
    const nextUnits = { ...draft.units, [key]: req };
    const nextDone = Math.min(req, Number(draft.doneUnits[key]) || 0);
    const nextDoneUnits = { ...draft.doneUnits, [key]: nextDone };
    const totalReq = UNIT_KEYS.reduce((s, k) => s + (Number(nextUnits[k]) || 0), 0);
    const totalDone = UNIT_KEYS.reduce((s, k) => s + (Number(nextDoneUnits[k]) || 0), 0);
    const updated = {
      ...draft,
      units: nextUnits,
      doneUnits: nextDoneUnits,
      total: totalReq,
      balance: Math.max(0, totalReq - totalDone)
    };
    setDraft(updated);
    onUpdate(updated);
  };

  const saveMeta = (e) => {
    e.preventDefault();
    onUpdate(draft);
    onClose();
  };

  const overallPct = calcProgress(draft);

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <form className="modal" onClick={(e) => e.stopPropagation()} onSubmit={saveMeta}>
        <div className="modal-head">
          <div>
            <h3>تحكم وإنجاز المشروع: {draft.file || "—"} · {draft.customer}</h3>
            <small style={{ color: "var(--ink-3)" }}>نسبة الإنجاز الحالية: <b className="mono">{overallPct}%</b></small>
          </div>
          <button type="button" className="btn btn-sm" onClick={onClose}>إغلاق</button>
        </div>

        <h4 style={{ margin: "0 0 8px" }}>تحديث الكميات المنجزة فعلياً لكل بند (يُحسب الإنجاز تلقائياً):</h4>
        {UNIT_KEYS.map((k) => {
          const req = Number(draft.units[k]) || 0;
          const done = Number(draft.doneUnits[k]) || 0;
          if (req === 0 && done === 0 && k !== "windows" && k !== "doors") return null;
          const itemPct = req > 0 ? Math.round((done / req) * 100) : 0;
          return (
            <div key={k} className="unit-ctrl-row">
              <div style={{ minWidth: 165 }}>
                <b>{UNIT_LABELS[k]}</b>
                <div style={{ fontSize: 12, color: "var(--ink-3)" }}>
                  منجز: <b className="mono">{done}</b> / مطلوب: <b className="mono">{req}</b> (<b className="mono">{itemPct}%</b>)
                </div>
              </div>
              <div className="step-group">
                <button type="button" className="step-btn" onClick={() => updateDoneUnit(k, done - 1)}>-</button>
                <input
                  type="number"
                  min="0"
                  max={req || 9999}
                  value={done}
                  onChange={(e) => updateDoneUnit(k, e.target.value)}
                  style={{ width: 64, textAlign: "center", padding: 4, borderRadius: 6, border: "1px solid var(--line-strong)" }}
                />
                <button type="button" className="step-btn" onClick={() => updateDoneUnit(k, done + 1)}>+</button>
                <button type="button" className="btn btn-sm" onClick={() => updateDoneUnit(k, done + 5)}>+5</button>
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 4, fontSize: 12 }}>
                <span>إجمالي البند:</span>
                <input
                  type="number"
                  min="0"
                  value={req}
                  onChange={(e) => updateReqUnit(k, e.target.value)}
                  style={{ width: 62, textAlign: "center", padding: 4, borderRadius: 6, border: "1px solid var(--line)" }}
                />
              </div>
            </div>
          );
        })}

        <details style={{ marginTop: 12 }}>
          <summary style={{ cursor: "pointer", fontWeight: 600, color: "var(--ink-2)" }}>تعديل بيانات المرحلة والمواعيد والملاحظات</summary>
          <div className="form-grid" style={{ marginTop: 10 }}>
            <div className="field">
              <label>المرحلة</label>
              <select value={draft.phase} onChange={(e) => setDraft({ ...draft, phase: e.target.value })}>
                {Object.entries(PHASE_LABELS).map(([k, v]) => <option key={k} value={k}>{v}</option>)}
              </select>
            </div>
            <div className="field"><label>تاريخ التسليم</label><input type="date" value={draft.delivery || ""} onChange={(e) => setDraft({ ...draft, delivery: e.target.value })} /></div>
            <div className="field"><label>ملاحظات / عوائق</label><input value={draft.note || ""} onChange={(e) => setDraft({ ...draft, note: e.target.value })} /></div>
          </div>
        </details>

        <div style={{ display: "flex", justifyContent: "flex-end", gap: 8, marginTop: 16 }}>
          <button type="submit" className="btn btn-primary">حفظ وإغلاق</button>
        </div>
      </form>
    </div>
  );
}

function AddProjectModal({ onClose, onSave }) {
  const [form, setForm] = useState({
    file: "", customer: "", area: "", glass: "", paint: "",
    approved: "", delivery: "", install: "", total: 0, balance: 0,
    phase: "making", note: "",
    units: { windows: 0, doors: 0, decor: 0, sliding: 0, curtainWall: 0, skylight: 0, louver: 0, flyScreen: 0, handrail: 0 }
  });

  const handleUnit = (k, val) => {
    const nextUnits = { ...form.units, [k]: Math.max(0, Number(val) || 0) };
    const sum = Object.values(nextUnits).reduce((a, b) => a + b, 0);
    setForm({ ...form, units: nextUnits, total: sum, balance: sum });
  };

  const submit = (e) => {
    e.preventDefault();
    if (!form.customer.trim()) return alert("يرجى إدخال اسم العميل");
    onSave({ ...form, id: form.file || `p-${Date.now()}` });
  };

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <form className="modal" onClick={(e) => e.stopPropagation()} onSubmit={submit}>
        <div className="modal-head">
          <h3>إضافة مشروع جديد</h3>
          <button type="button" className="btn btn-sm" onClick={onClose}>✕</button>
        </div>
        <div className="form-grid">
          <div className="field"><label>رقم الملف (File)</label><input value={form.file} onChange={(e) => setForm({ ...form, file: e.target.value })} /></div>
          <div className="field"><label>اسم العميل *</label><input required value={form.customer} onChange={(e) => setForm({ ...form, customer: e.target.value })} /></div>
          <div className="field"><label>المنطقة (Area)</label><input value={form.area} onChange={(e) => setForm({ ...form, area: e.target.value })} /></div>
          <div className="field"><label>الزجاج (Glass)</label><input value={form.glass} onChange={(e) => setForm({ ...form, glass: e.target.value })} /></div>
          <div className="field"><label>الدهان (Paint)</label><input value={form.paint} onChange={(e) => setForm({ ...form, paint: e.target.value })} /></div>
          <div className="field">
            <label>المرحلة</label>
            <select value={form.phase} onChange={(e) => setForm({ ...form, phase: e.target.value })}>
              {Object.entries(PHASE_LABELS).map(([k, v]) => <option key={k} value={k}>{v}</option>)}
            </select>
          </div>
          <div className="field"><label>الاعتماد</label><input type="date" value={form.approved} onChange={(e) => setForm({ ...form, approved: e.target.value })} /></div>
          <div className="field"><label>التسليم</label><input type="date" value={form.delivery} onChange={(e) => setForm({ ...form, delivery: e.target.value })} /></div>
          <div className="field"><label>التركيب</label><input type="date" value={form.install} onChange={(e) => setForm({ ...form, install: e.target.value })} /></div>
        </div>

        <div className="field" style={{ marginTop: 10 }}>
          <label>بنود المشروع (يمكنك تحديث المنجز لكل بند بعد الحفظ من داخل المشروع):</label>
          <div className="form-grid" style={{ marginTop: 6 }}>
            {UNIT_KEYS.map((k) => (
              <div key={k} className="field">
                <label style={{ fontSize: 11 }}>{UNIT_LABELS[k]}</label>
                <input type="number" min="0" value={form.units[k]} onChange={(e) => handleUnit(k, e.target.value)} />
              </div>
            ))}
          </div>
        </div>

        <div className="field" style={{ marginTop: 10 }}>
          <label>ملاحظات</label>
          <input value={form.note} onChange={(e) => setForm({ ...form, note: e.target.value })} />
        </div>
        <div style={{ display: "flex", justifyContent: "flex-end", gap: 8, marginTop: 16 }}>
          <button type="button" className="btn" onClick={onClose}>إلغاء</button>
          <button type="submit" className="btn btn-primary">حفظ المشروع</button>
        </div>
      </form>
    </div>
  );
}

        </form>
        <div style={{ marginTop: 14, paddingTop: 12, borderTop: "1px solid var(--line)", fontSize: 12, color: "var(--ink-3)" }}>
          <div>الإيميلات المعتمدة حالياً:</div>
          {designers.map((d) => <div key={d.id} className="mono">{d.name}: {d.email}</div>)}
          <div className="mono">Manager: {MANAGER_EMAIL}</div>
        </div>
        {session && (
          <button type="button" className="btn btn-sm" style={{ marginTop: 12 }} onClick={onLogout}>تسجيل الخروج</button>
        )}
      </div>
    </div>
  );
}

function EmailsModal({ designers, onClose, onSave }) {
  const [list, setList] = useState(designers.map((d) => ({ ...d })));
  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()} style={{ maxWidth: 460 }}>
        <div className="modal-head">
          <h3>إدارة إيميلات المصممين</h3>
          <button type="button" className="btn btn-sm" onClick={onClose}>✕</button>
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {list.map((d, idx) => (
            <div key={d.id} className="field">
              <label>{d.name}</label>
              <input
                type="email"
                value={d.email}
                onChange={(e) => {
                  const next = [...list];
                  next[idx] = { ...next[idx], email: e.target.value };
                  setList(next);
                }}
              />
            </div>
          ))}
        </div>
        <div style={{ display: "flex", justifyContent: "flex-end", gap: 8, marginTop: 16 }}>
          <button type="button" className="btn" onClick={onClose}>إلغاء</button>
          <button type="button" className="btn btn-primary" onClick={() => onSave(list)}>حفظ الإيميلات</button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
